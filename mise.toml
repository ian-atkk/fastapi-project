[tools]
cocogitto = "7.0.0"
node = "24"
python = "3.15.2"
shellcheck = "0.11.0"
uv = "0.13.8"

[env]
NODE_ENV = "development"

[settings]
lockfile = true

[tasks.versions]
description = "Show managed tool versions"
run = '''
node --version
python --version
uv --version
'''

[tasks.dev]
description = "Run the FastAPI app with uvicorn"
run = "uv run uvicorn main:app --reload --port 8001"

[tasks.python_check]
description = "Run ty and ruff to check python code"
run = '''
uv run ruff check
uv run ty check
'''

[tasks.shell_check]
description = "Run shellcheck on all shell scripts"
run = "shellcheck scripts/*.sh"

[tasks.commit_check]
description = "Run cog on commit history"
run = "cog check"