[tools]
node = "24"
python = "3.15.2"
uv = "0.13.8"

[env]
NODE_ENV = "development"

[settings]
lockfile = true

[tasks.versions]
description = "Show managed tool versions"
run = '''
node --version
python --version
uv --version
'''

[tasks.dev]
description = "Run the FastAPI app with uvicorn"
run = "uv run uvicorn main:app --reload --port 8001"
