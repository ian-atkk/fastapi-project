name: Build release and generate SBOM

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout project repo
        uses: actions/checkout@v4

      - name: Install mise and project tools
        uses: jdx/mise-action@v5

      - name: Sync Python dependencies
        run: mise exec -- uv sync --locked
      
      - name: Build release
        run: mise exec -- uv build

      - name: Generate CycloneDX SBOM
        run: mise exec -- syft . -o cyclonedx-json=sbom.cdx.json

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Project-SBOM
          path: |
            sbom.cdx.json
            dist/*

      - name: Checkout central SBOM repo
        uses: actions/checkout@v4
        with:
          repository: ian-atkk/central-SBOM-repo
          token: ${{ secrets.EXTERNAL_REPO_TOKEN }}
          ref: main
          path: central-sbom-repo

      - name: Copy SBOM to central repo
        run: |
          mkdir -p central-sbom-repo/fastapi-project/sboms
          cp sbom.cdx.json central-sbom-repo/fastapi-project/sboms/${{ github.ref_name }}.cdx.json

      - name: Commit and push SBOM
        working-directory: central-sbom-repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Add fastapi-project ${{ github.ref_name }} SBOM"
          git push  