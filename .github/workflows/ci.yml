# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: CI checks

on:
  push:
    branches: [ "main" ]
     paths-ignore:
     - "docs/**"
     - ".github/**"   
  pull_request:
    branches: [ "main" ]
    paths-ignore:
    - "docs/**"
    - ".github/**"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install mise and project tools
        uses: jdx/mise-action@v5

      - name: Sync Python dependencies
        run: mise exec -- uv sync --locked

      - name: Run Ruff
        run: mise exec -- uv run ruff check .

      - name: Run ty
        run: mise exec -- uv run ty check
        
      - name: Run ShellCheck
        run: mise exec -- shellcheck scripts/*.sh

      - name: Check commit messages
        run: mise exec -- cog check

      - name: Test build
        run: mise exec -- uv build