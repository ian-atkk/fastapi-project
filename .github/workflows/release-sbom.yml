name: Generate SBOM and scan for vulnerabilities

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install mise and project tools
        uses: jdx/mise-action@v5

      - name: Generate SBOM and save to JSON
        run: mise exec -- syft . -o cyclonedx-json=sbom.cdx.json

      - name: Run a vulnerability db scan
        run: mise exec -- grype sbom:./sbom.cdx.json > grype-report.json
      
      - name: Upload vulnerability report
        uses: actions/upload-artifact@v4
        with:
          name: grype-vulnerability-report
          path: grype-report.json